<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#081b37"><title>MapAtlas Navi</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--navy:#081b37;--ink:#102a43;--blue:#08a8ff;--green:#087a4b;--gold:#ffd52a}
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden;background:#a9d8ee}#map{position:absolute;inset:0}
.top{position:absolute;z-index:10;top:10px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.brand{background:linear-gradient(110deg,#06254d,#124d87);color:#fff;border:2px solid #72caff;border-radius:24px;padding:9px 15px;box-shadow:0 4px 0 #06152c;font-weight:950;letter-spacing:.2px;pointer-events:auto}
.brand small{display:block;font-size:10px;font-weight:700;opacity:.85}.brand b{font-size:19px}.brand em{color:#ffe23b;font-style:normal}
.round{width:45px;height:45px;border:2px solid #9bdcff;border-radius:50%;background:#09254a;color:white;font-size:22px;box-shadow:0 3px 0 #06152c}
.turn{position:absolute;z-index:10;top:82px;left:12px;right:12px;background:linear-gradient(110deg,#006d3c,#079b58);color:white;border:3px solid #8df6b7;border-radius:20px;padding:10px 14px;box-shadow:0 5px 0 #073b2a;display:flex;align-items:center;gap:12px;min-height:76px}
.turn .arrow{font-size:42px;line-height:1}.turn .hint{font-weight:900;font-size:15px}.turn .hint strong{display:block;font-size:26px;color:#ffed48;line-height:1.15}
.search{position:absolute;z-index:10;top:168px;left:12px;right:12px;display:flex;gap:6px}
.search input{min-width:0;flex:1;border:2px solid #193655;border-radius:14px;padding:11px 13px;font-size:14px;background:#fff;color:#132c46;box-shadow:0 3px 0 #193655}
.search button,.chip{border:2px solid #193655;border-radius:14px;padding:9px 12px;background:#ffe071;color:#17324d;font-weight:900;box-shadow:0 3px 0 #193655;white-space:nowrap}
.chips{position:absolute;z-index:9;top:218px;left:12px;right:12px;display:flex;gap:7px;overflow-x:auto;padding:2px 2px 7px}
.chip{font-size:12px;padding:8px 11px}
.side{position:absolute;z-index:9;right:12px;top:48%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px}
.side button{width:44px;height:44px;border-radius:50%;border:2px solid #b5e7ff;background:#09264b;color:#fff;font-size:18px;font-weight:900;box-shadow:0 3px 0 #06152c}
.stats{position:absolute;z-index:10;bottom:88px;left:12px;right:12px;background:linear-gradient(110deg,#071a35,#142d50);color:#fff;border:2px solid #8bd4ff;border-radius:20px;padding:11px 14px;display:flex;justify-content:space-around;box-shadow:0 4px 0 #06152c}
.stat{text-align:center;font-weight:800}.stat strong{display:block;font-size:26px;color:#ffe13b}.stat small{font-size:11px;color:#c9eaff}
.actions{position:absolute;z-index:11;bottom:14px;left:12px;right:12px;display:flex;gap:8px}
.action{flex:1;border:2px solid #193655;border-radius:16px;padding:13px 6px;background:#fff;color:#17324d;font-weight:950;font-size:13px;box-shadow:0 4px 0 #193655}
.action.primary{background:linear-gradient(110deg,#078be9,#05c1ff);color:#fff;border-color:#07518d}.action.stop{background:#ef475b;color:white}
.notice{position:absolute;z-index:30;left:12px;right:12px;top:280px;text-align:center;background:#071a35eF;color:white;border:1px solid #8bd4ff;border-radius:12px;padding:9px;font-size:12px;display:none}
.bike{font-size:34px;filter:drop-shadow(0 3px 2px #0009);transform:translateY(-5px)}
.maplibregl-ctrl-group{border:2px solid #163b60!important;border-radius:12px!important;overflow:hidden}.maplibregl-ctrl button{background:#fff!important}
@media(max-height:700px){.turn{top:72px;min-height:64px}.turn .arrow{font-size:34px}.turn .hint strong{font-size:22px}.search{top:144px}.chips{top:192px}.stats{bottom:76px}.actions{bottom:8px}}
</style></head>
<body>
<div id="map"></div>
<div class="top"><div class="brand"><small>🏙️ 3D CITY MOTORCYCLE NAVIGATION</small><b>MapAtlas <em>Navi</em></b></div><button class="round" id="settings" aria-label="ตั้งค่า">⚙</button></div>
<div class="turn"><div class="arrow" id="turnArrow">⬆</div><div class="hint"><strong id="turnDistance">พร้อมออกเดินทาง</strong><span id="turnText">เลือกจุดหมาย แล้วกดเริ่มนำทาง</span></div></div>
<div class="search"><input id="placeSearch" placeholder="ค้นหาสถานที่ / ชื่อถนน / จุดหมาย"><button id="searchBtn">ค้นหา</button></div>
<div class="chips"><button class="chip" data-lat="13.7456" data-lon="100.5342" data-name="สยาม">📍 สยาม</button><button class="chip" data-lat="13.7285" data-lon="100.5349" data-name="สีลม">📍 สีลม</button><button class="chip" data-lat="13.7335" data-lon="100.5811" data-name="ทองหล่อ">📍 ทองหล่อ</button><button class="chip" data-lat="13.8160" data-lon="100.5607" data-name="ลาดพร้าว">📍 ลาดพร้าว</button></div>
<div class="side"><button id="compass">N</button><button id="voice">🔊</button><button id="tilt">3D</button><button id="zoomIn">＋</button><button id="zoomOut">－</button></div>
<div class="stats"><div class="stat"><small>ถึงจุดหมายใน</small><strong id="eta">—</strong></div><div class="stat"><small>ระยะทาง</small><strong id="distance">—</strong></div></div>
<div class="actions"><button class="action" id="gps">🎯 ตำแหน่งฉัน</button><button class="action primary" id="start">▶ เริ่มนำทาง</button><button class="action stop" id="stop">✕ ยกเลิก</button></div>
<div class="notice" id="notice"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(()=> {
const $=id=>document.getElementById(id);
let me=null,dest=null,route=null,steps=[],stepIndex=0,watchId=null,userMarker=null,destMarker=null,voiceOn=true,routeBusy=false,lastReroute=0,is3D=true;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[100.5342,13.7456],zoom:15.5,pitch:62,bearing:-18,antialias:true});
map.addControl(new maplibregl.NavigationControl({showCompass:false,showZoom:false}),'top-right');
function say(t){if(voiceOn&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=1;speechSynthesis.speak(u)}}
function notice(t){$('notice').textContent=t;$('notice').style.display='block';clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('notice').style.display='none',3500)}
function markerEl(txt,cls){const e=document.createElement('div');e.className=cls||'';e.textContent=txt;return e}
function setStatus(a,b,arrow){$('turnDistance').textContent=a;$('turnText').textContent=b;$('turnArrow').textContent=arrow||'⬆'}
function distM(a,b){const R=6371000,p=Math.PI/180,dp=(b[1]-a[1])*p,dl=(b[0]-a[0])*p,x=Math.sin(dp/2)**2+Math.cos(a[1]*p)*Math.cos(b[1]*p)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1)+' กม.':Math.round(m)+' ม.'}
function maneuver(s){const m=s.maneuver||{},type=m.type||'continue',mod=m.modifier||'';if(type==='arrive')return ['🏁','ถึงจุดหมายแล้ว','🏁'];if(type==='roundabout'||type==='rotary')return ['↻','เข้าวงเวียน','↻'];if(mod.includes('left'))return ['↰','เลี้ยวซ้าย','⬅'];if(mod.includes('right'))return ['↱','เลี้ยวขวา','➡'];if(type==='uturn')return ['↶','กลับรถ','↶'];if(type==='depart')return ['⬆','มุ่งหน้าตรงไป','⬆'];return ['⬆','ตรงไป','⬆']}
function addRouteLayer(){if(!map.getSource('routeLine'))map.addSource('routeLine',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});if(!map.getLayer('routeGlow'))map.addLayer({id:'routeGlow',type:'line',source:'routeLine',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#00c8ff','line-width':13,'line-opacity':.38,'line-blur':2}});if(!map.getLayer('routeLineLayer'))map.addLayer({id:'routeLineLayer',type:'line',source:'routeLine',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#087dff','line-width':6,'line-opacity':.98}})}
map.on('load',()=>{
 const layers=map.getStyle().layers||[];const label=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);
 if(map.getSource('openmaptiles'))map.addLayer({id:'mapatlas-cartoon-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:13,paint:{'fill-extrusion-color':['match',['get','class'],'commercial','#ffb36e','industrial','#a8c5ed','residential','#f5d28c','retail','#ef9bc1','#b7d9bd'],'fill-extrusion-height':['max',['coalesce',['get','render_height'],0],6],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.98}},label?label.id:undefined);
 addRouteLayer();setStatus('พร้อมนำทาง','เลือกจุดหมายจากช่องค้นหาหรือแตะแผนที่');
});
map.on('error',e=>console.warn('Map error',e.error));
function selectDest(lon,lat,name){dest={lon,lat,name:name||'จุดหมาย'};$('placeSearch').value=dest.name;if(destMarker)destMarker.remove();destMarker=new maplibregl.Marker({element:markerEl('📍','bike')}).setLngLat([lon,lat]).addTo(map);map.flyTo({center:[lon,lat],zoom:16.5,pitch:is3D?62:0,duration:900});setStatus('เลือกแล้ว: '+dest.name,'กดเริ่มนำทางเมื่อพร้อม');}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>selectDest(+b.dataset.lon,+b.dataset.lat,b.dataset.name)));
map.on('click',e=>{if(route)return;selectDest(e.lngLat.lng,e.lngLat.lat,'ตำแหน่งบนแผนที่')});
async function searchPlace(){const q=$('placeSearch').value.trim();if(!q)return notice('พิมพ์ชื่อสถานที่ก่อน');notice('กำลังค้นหาสถานที่…');try{const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=th&q='+encodeURIComponent(q);const r=await fetch(u);if(!r.ok)throw Error('search');const a=await r.json();if(!a.length)return notice('ไม่พบสถานที่นี้ ลองใช้ชื่ออื่น');selectDest(+a[0].lon,+a[0].lat,a[0].name||q)}catch(e){notice('ค้นหาไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')}}
$('searchBtn').onclick=searchPlace;$('placeSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});
let geoPluginPromise=null;async function getGeoPlugin(){if(!geoPluginPromise)geoPluginPromise=import('https://esm.sh/@capacitor/geolocation@6.0.2').then(m=>m.Geolocation);return geoPluginPromise}async function requestGeoPermission(){const Geo=await getGeoPlugin();const p=await Geo.requestPermissions();if(p.location!=='granted'&&p.coarseLocation!=='granted')throw Error('ผู้ใช้ยังไม่อนุญาตสิทธิ์ตำแหน่ง GPS');return Geo}async function locate(){try{notice('กำลังขอสิทธิ์เข้าถึงตำแหน่ง GPS…');const Geo=await requestGeoPermission();notice('ได้รับสิทธิ์แล้ว กำลังค้นหาตำแหน่ง…');const p=await Geo.getCurrentPosition({enableHighAccuracy:true,timeout:20000});onPosition(p);map.flyTo({center:[me.lon,me.lat],zoom:17.5,pitch:is3D?62:0});notice('พบตำแหน่งของคุณแล้ว · ความคลาดเคลื่อนประมาณ '+Math.round(p.coords.accuracy)+' เมตร')}catch(e){notice('GPS: '+(e.message||'ไม่สามารถขอตำแหน่งได้')+' · ตรวจการอนุญาตตำแหน่งในตั้งค่า Android')}}
function onPosition(p){me={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};if(!userMarker)userMarker=new maplibregl.Marker({element:markerEl('🏍️','bike'),anchor:'bottom'}).setLngLat([me.lon,me.lat]).addTo(map);else userMarker.setLngLat([me.lon,me.lat]);if(route)updateNavigation()}
$('gps').onclick=locate;
async function getRoute(recalc){if(!dest)return notice('เลือกจุดหมายก่อน');if(routeBusy)return;let Geo;try{Geo=await requestGeoPermission();if(!me){const p=await Geo.getCurrentPosition({enableHighAccuracy:true,timeout:20000});onPosition(p)}}catch(e){return notice('ยังใช้ GPS ไม่ได้: '+(e.message||'กรุณาอนุญาตตำแหน่ง'))}if(routeBusy)return;routeBusy=true;setStatus('กำลังคำนวณเส้นทาง…','รอสักครู่');try{const url='https://router.project-osrm.org/route/v1/driving/'+me.lon+','+me.lat+';'+dest.lon+','+dest.lat+'?overview=full&geometries=geojson&steps=true';const r=await fetch(url);if(!r.ok)throw Error('route');const d=await r.json();if(d.code!=='Ok'||!d.routes?.length)throw Error('no route');route=d.routes[0];steps=route.legs.flatMap(l=>l.steps||[]).filter(s=>s.maneuver);stepIndex=Math.min(1,Math.max(0,steps.length-1));map.getSource('routeLine').setData({type:'Feature',properties:{},geometry:route.geometry});$('eta').textContent=Math.max(1,Math.round(route.duration/60))+' นาที';$('distance').textContent=fmtDist(route.distance);map.fitBounds([[Math.min(me.lon,dest.lon),Math.min(me.lat,dest.lat)],[Math.max(me.lon,dest.lon),Math.max(me.lat,dest.lat)]],{padding:{top:260,bottom:190,left:55,right:55},maxZoom:17,duration:900});setStatus(recalc?'คำนวณเส้นทางใหม่แล้ว':'เส้นทางพร้อมแล้ว','เส้นทางทดลอง · ตรวจป้ายและข้อห้ามก่อนขับ');notice('ข้อจำกัด: เส้นทางนี้ใช้โปรไฟล์รถยนต์ ยังไม่ใช่ระบบนำทางมอเตอร์ไซค์โดยเฉพาะ');updateNavigation(true);if(watchId===null){Geo.watchPosition({enableHighAccuracy:true,maximumAge:1000,timeout:15000},(p,e)=>{if(p)onPosition(p);else if(e)notice('GPS ขาดการเชื่อมต่อ: '+e.message)}).then(id=>watchId=id).catch(e=>notice('เริ่มติดตาม GPS ไม่ได้: '+e.message));}}catch(e){route=null;setStatus('คำนวณเส้นทางไม่ได้','ตรวจอินเทอร์เน็ต หรือเลือกจุดหมายใหม่');notice('บริการเส้นทางสาธารณะไม่ตอบสนอง ลองอีกครั้ง');}finally{routeBusy=false}}
function updateNavigation(initial){if(!route||!me)return;const here=[me.lon,me.lat];let near=Infinity;for(const c of route.geometry.coordinates){const d=distM(here,c);if(d<near)near=d}
if(near>85&&Date.now()-lastReroute>12000){lastReroute=Date.now();getRoute(true);return}
let s=steps[stepIndex];if(!s)return;let target=s.maneuver?.location||s.geometry?.coordinates?.[0];let left=target?distM(here,target):0;
if(left<28&&stepIndex<steps.length-1){stepIndex++;s=steps[stepIndex];target=s.maneuver?.location||s.geometry?.coordinates?.[0];left=target?distM(here,target):0}
const [ic,txt,ar]=maneuver(s);setStatus(left<30?'ถึงจุดเลี้ยวแล้ว':'อีก '+fmtDist(left),txt,ar);if(initial||left<220&&left>170)say('อีก '+Math.round(left/10)*10+' เมตร '+txt);
if(stepIndex>=steps.length-1&&left<25){setStatus('ถึงจุดหมายแล้ว','เดินทางโดยสวัสดิภาพ','🏁');say('ถึงจุดหมายแล้ว');route=null}
}
$('start').onclick=()=>{if(!dest)return notice('เลือกจุดหมายก่อน');if(!navigator.geolocation)return notice('อุปกรณ์ไม่รองรับ GPS');if(!me){locate();notice('รอ GPS ระบุตำแหน่ง แล้วกดเริ่มนำทางอีกครั้ง');return}getRoute(false)};
$('stop').onclick=()=>{route=null;steps=[];stepIndex=0;if(watchId!==null){getGeoPlugin().then(Geo=>Geo.clearWatch({id:watchId})).catch(()=>{});watchId=null}if(map.getSource('routeLine'))map.getSource('routeLine').setData({type:'Feature',geometry:{type:'LineString',coordinates:[]}});$('eta').textContent='—';$('distance').textContent='—';setStatus('ยกเลิกเส้นทางแล้ว','เลือกจุดหมายเพื่อเริ่มใหม่')};
$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent=voiceOn?'🔊':'🔇';if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();notice(voiceOn?'เปิดเสียงนำทาง':'ปิดเสียงนำทาง')};
$('tilt').onclick=()=>{is3D=!is3D;map.easeTo({pitch:is3D?62:0,duration:700});$('tilt').textContent=is3D?'3D':'2D'};
$('zoomIn').onclick=()=>map.zoomTo(map.getZoom()+1);$('zoomOut').onclick=()=>map.zoomTo(map.getZoom()-1);$('compass').onclick=()=>map.easeTo({bearing:0,pitch:is3D?62:0,duration:600});
$('settings').onclick=()=>notice('รุ่นทดลอง: เส้นทาง OSRM ใช้โปรไฟล์รถยนต์ ไม่ใช่เส้นทางมอเตอร์ไซค์เฉพาะ โปรดตรวจป้ายและข้อห้าม');
})();
</script></body></html>
