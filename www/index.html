<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#9bd9ee"><title>MapAtlas Navi</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif}body{overflow:hidden;background:#bfe8f5}#map{position:absolute;inset:0}.top{position:absolute;z-index:10;top:12px;left:12px;right:12px;background:#fffdf5;border:3px solid #26334b;border-radius:20px;padding:12px 15px;box-shadow:0 5px 0 #26334b}.brand{font-size:12px;font-weight:900;color:#59677e}.status{font-size:17px;font-weight:900;color:#137b63;margin-top:3px}.dest{position:absolute;z-index:10;top:112px;left:12px;right:12px;display:flex;gap:8px;overflow-x:auto;padding:3px 2px 8px}.dest button{white-space:nowrap;border:3px solid #26334b;border-radius:16px;padding:10px 15px;background:#ffd76a;color:#26334b;font-weight:900;box-shadow:0 3px 0 #26334b}.dest button.selected{background:#ff9f80}.bottom{position:absolute;z-index:10;bottom:20px;left:12px;right:12px;display:flex;justify-content:center}.btn{width:min(90%,360px);border:3px solid #26334b;border-radius:18px;padding:16px;font-size:17px;font-weight:900;background:#16a879;box-shadow:0 4px 0 #26334b;color:white}.btn:disabled{background:#aab3bd}.marker{font-size:32px;line-height:1}</style></head><body><div id="map"></div><div class="top"><div class="brand">🗺️ MAPATLAS NAVI · CARTOON CITY</div><div class="status" id="status">เลือกสถานที่ที่ต้องการไป</div></div><div class="dest"><button data-lat="13.7456" data-lon="100.5342" data-name="สยาม">📍 สยาม</button><button data-lat="13.7285" data-lon="100.5349" data-name="สีลม">📍 สีลม</button><button data-lat="13.7335" data-lon="100.5811" data-name="ทองหล่อ">📍 ทองหล่อ</button><button data-lat="13.8160" data-lon="100.5607" data-name="ลาดพร้าว">📍 ลาดพร้าว</button></div><div class="bottom"><button class="btn" id="openmap" disabled>เลือกสถานที่ก่อน</button></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>const $=id=>document.getElementById(id);let dest=null,marker=null;const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[100.5342,13.7456],zoom:15,pitch:58,bearing:-18,antialias:true});map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');map.on('load',()=>{$('status').textContent='เลือกสถานที่ที่ต้องการไป';const layers=map.getStyle().layers;const label=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);if(map.getSource('openmaptiles'))map.addLayer({id:'mapatlas-cartoon-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:13,paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],0],0,'#ffe39a',12,'#ffbd9b',30,'#c9b5f2',60,'#9edbd0',100,'#f5a9c8'],'fill-extrusion-height':['max',['coalesce',['get','render_height'],0],5],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':1}},label?label.id:undefined)});document.querySelectorAll('.dest button').forEach(b=>b.addEventListener('click',()=>{dest={lat:+b.dataset.lat,lon:+b.dataset.lon,name:b.dataset.name};document.querySelectorAll('.dest button').forEach(x=>x.classList.toggle('selected',x===b));$('status').textContent='จุดหมายที่เลือก: '+dest.name;$('openmap').disabled=false;$('openmap').textContent='เปิด Google Maps ไป '+dest.name;map.flyTo({center:[dest.lon,dest.lat],zoom:16,pitch:58});if(marker)marker.remove();const el=document.createElement('div');el.className='marker';el.textContent='📍';marker=new maplibregl.Marker({element:el}).setLngLat([dest.lon,dest.lat]).addTo(map)}));$('openmap').addEventListener('click',()=>{if(!dest)return;const url='https://www.google.com/maps/dir/?api=1&destination='+dest.lat+','+dest.lon+'&travelmode=driving';window.location.href=url});</script></body></html>
