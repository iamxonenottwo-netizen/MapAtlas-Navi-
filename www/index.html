<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#9bd9ee"><title>MapAtlas Navi · Cartoon City</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif}body{overflow:hidden;background:#bfe8f5}#map{position:absolute;inset:0}
.top{position:absolute;z-index:10;top:12px;left:12px;right:12px;background:#fffdf5;border:3px solid #26334b;border-radius:20px;padding:12px 15px;box-shadow:0 5px 0 #26334b}.brand{font-size:12px;font-weight:900;letter-spacing:1px;color:#59677e}.status{font-size:17px;font-weight:900;color:#137b63;margin-top:3px}
.dest{position:absolute;z-index:10;top:112px;left:12px;right:12px;display:flex;gap:8px;overflow-x:auto;padding:3px 2px 8px}.dest button{white-space:nowrap;border:3px solid #26334b;border-radius:16px;padding:10px 15px;background:#ffd76a;color:#26334b;font-weight:900;box-shadow:0 3px 0 #26334b}
.bottom{position:absolute;z-index:10;bottom:20px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btn{border:3px solid #26334b;border-radius:17px;padding:13px 16px;font-weight:900;background:#fffdf5;box-shadow:0 4px 0 #26334b;color:#26334b}.primary{background:#16a879;color:white}.note{position:absolute;z-index:9;bottom:90px;left:12px;right:12px;text-align:center;font-size:11px;font-weight:800;color:#26334b;background:#fffdf0dd;border-radius:12px;padding:5px}
.marker{font-size:32px;filter:drop-shadow(0 3px 1px #26334b66);line-height:1}.maplibregl-ctrl-group{border:2px solid #26334b!important;border-radius:12px!important;overflow:hidden}.maplibregl-ctrl button{background:#fffdf5!important}
</style></head><body>
<div id="map"></div>
<div class="top"><div class="brand">🗺️ MAPATLAS NAVI · CARTOON CITY</div><div class="status" id="status">กำลังโหลดเมืองการ์ตูน…</div></div>
<div class="dest"><button data-lat="13.7456" data-lon="100.5342" data-name="สยาม">📍 สยาม</button><button data-lat="13.7285" data-lon="100.5349" data-name="สีลม">📍 สีลม</button><button data-lat="13.7335" data-lon="100.5811" data-name="ทองหล่อ">📍 ทองหล่อ</button><button data-lat="13.8160" data-lon="100.5607" data-name="ลาดพร้าว">📍 ลาดพร้าว</button></div>
<div class="bottom"><button class="btn" id="gps">🏍️ ตำแหน่งฉัน</button><button class="btn primary" id="route">▶ นำทาง</button><button class="btn" id="google">G Google Maps</button></div><div class="note">เมืองการ์ตูนรุ่นทดลอง · เส้นทางจริงเปิดผ่าน Google Maps</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id);let me=null,dest=null,userMarker=null,destMarker=null;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[100.5342,13.7456],zoom:15,pitch:58,bearing:-18,antialias:true});
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');
map.on('load',()=>{
 $('status').textContent='เมืองพร้อมแล้ว · เลือกจุดหมาย';
 const layers=map.getStyle().layers;const label=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);
 if(map.getSource('openmaptiles')) map.addLayer({id:'mapatlas-cartoon-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:13,paint:{
 'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],0],0,'#ffe39a',12,'#ffbd9b',30,'#c9b5f2',60,'#9edbd0',100,'#f5a9c8'],
 'fill-extrusion-height':['max',['coalesce',['get','render_height'],0],5],
 'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
 'fill-extrusion-opacity':1
 }},label?label.id:undefined);
});
map.on('error',e=>console.warn('Map error',e.error));
function makeMarker(emoji,cls){const el=document.createElement('div');el.className='marker '+(cls||'');el.textContent=emoji;return el}
document.querySelectorAll('.dest button').forEach(b=>b.addEventListener('click',()=>{
 dest={lat:Number(b.dataset.lat),lon:Number(b.dataset.lon),name:b.dataset.name};$('status').textContent='เลือกจุดหมาย: '+dest.name;
 map.flyTo({center:[dest.lon,dest.lat],zoom:16,pitch:58});
 if(destMarker)destMarker.remove();destMarker=new maplibregl.Marker({element:makeMarker('📍')}).setLngLat([dest.lon,dest.lat]).addTo(map);
}));
$('gps').addEventListener('click',()=>{
 if(!navigator.geolocation){$('status').textContent='อุปกรณ์นี้ไม่รองรับ GPS';return}
 $('status').textContent='กำลังค้นหาตำแหน่ง GPS…';
 navigator.geolocation.getCurrentPosition(p=>{
  me={lat:p.coords.latitude,lon:p.coords.longitude};map.flyTo({center:[me.lon,me.lat],zoom:17,pitch:58});$('status').textContent='พบตำแหน่งของคุณแล้ว';
  if(userMarker)userMarker.remove();userMarker=new maplibregl.Marker({element:makeMarker('🏍️')}).setLngLat([me.lon,me.lat]).addTo(map);
 },e=>$('status').textContent='อ่าน GPS ไม่สำเร็จ: '+e.message,{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
});
function openGoogle(){if(!dest){$('status').textContent='กรุณาเลือกจุดหมายก่อน';return}let u='https://www.google.com/maps/dir/?api=1&destination='+dest.lat+','+dest.lon+'&travelmode=driving';if(me)u+='&origin='+me.lat+','+me.lon;window.open(u,'_blank');}
$('google').addEventListener('click',openGoogle);
$('route').addEventListener('click',()=>{if(!dest){$('status').textContent='กรุณาเลือกจุดหมายก่อน';return}if(!me){$('status').textContent='กดตำแหน่งฉันก่อนเริ่มนำทาง';return}openGoogle()});
</script></body></html>
