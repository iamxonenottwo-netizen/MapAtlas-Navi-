<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>MapAtlas Navi</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif}body{overflow:hidden;background:#101827}#map{position:absolute;inset:0}.top{position:absolute;z-index:5;top:12px;left:12px;right:12px;background:#fff;border-radius:16px;padding:12px 15px;box-shadow:0 4px 18px #0004}.brand{font-size:12px;color:#64748b}.status{font-weight:700;color:#087f5b}.bottom{position:absolute;z-index:5;bottom:16px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:700;background:#fff;box-shadow:0 3px 12px #0003;color:#172033}.primary{background:#0b9b72;color:white}.dest{position:absolute;z-index:5;top:105px;left:12px;right:12px;display:flex;gap:7px;overflow:auto}.dest button{white-space:nowrap;border:0;border-radius:12px;padding:9px 12px;background:#172033;color:white}.note{position:absolute;z-index:5;bottom:82px;left:12px;right:12px;text-align:center;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}
</style></head><body><div id="map"></div><div class="top"><div class="brand">🗺️ MAPATLAS NAVI · CARTOON CITY</div><div class="status" id="status">กำลังโหลดแผนที่…</div></div><div class="dest"><button data-lat="13.7456" data-lon="100.5342" data-name="สยาม">📍 สยาม</button><button data-lat="13.7285" data-lon="100.5349" data-name="สีลม">📍 สีลม</button><button data-lat="13.7335" data-lon="100.5811" data-name="ทองหล่อ">📍 ทองหล่อ</button><button data-lat="13.8160" data-lon="100.5607" data-name="ลาดพร้าว">📍 ลาดพร้าว</button></div><div class="bottom"><button class="btn" id="gps">🎯 ตำแหน่งฉัน</button><button class="btn primary" id="route">▶ เริ่มนำทาง</button><button class="btn" id="google">G Google Maps</button></div><div class="note">ต้นแบบทดลอง · ตรวจสอบเส้นทางก่อนออกเดินทาง</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const $=id=>document.getElementById(id);let me=null,dest=null,userMarker=null,destMarker=null;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[100.5342,13.7456],zoom:15,pitch:55,bearing:-15,antialias:true});
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');
map.on('load',()=>{$('status').textContent='แผนที่พร้อม · เลือกจุดหมาย';const layers=map.getStyle().layers;const label=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);map.addLayer({id:'mapatlas-3d-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:13,paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],0],0,'#f5d9a8',30,'#e7a77d',80,'#d98c9b'],'fill-extrusion-height':['coalesce',['get','render_height'],6],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.92}},label?label.id:undefined)});
map.on('error',e=>console.warn('Map error',e.error));
document.querySelectorAll('.dest button').forEach(b=>b.onclick=()=>{dest={lat:+b.dataset.lat,lon:+b.dataset.lon,name:b.dataset.name};$('status').textContent='จุดหมาย: '+dest.name;map.flyTo({center:[dest.lon,dest.lat],zoom:16,pitch:55});if(destMarker)destMarker.remove();destMarker=new maplibregl.Marker({color:'#ef4444'}).setLngLat([dest.lon,dest.lat]).addTo(map)});
$('gps').onclick=()=>{if(!navigator.geolocation){$('status').textContent='อุปกรณ์ไม่รองรับ GPS';return}$('status').textContent='กำลังค้นหาตำแหน่ง…';navigator.geolocation.getCurrentPosition(p=>{me={lat:p.coords.latitude,lon:p.coords.longitude};map.flyTo({center:[me.lon,me.lat],zoom:17});$('status').textContent='พบตำแหน่งของคุณแล้ว';if(userMarker)userMarker.remove();userMarker=new maplibregl.Marker({color:'#1677ff'}).setLngLat([me.lon,me.lat]).addTo(map)},e=>$('status').textContent='อ่าน GPS ไม่สำเร็จ: '+e.message,{enableHighAccuracy:true,timeout:15000})};
function google(){if(!dest){$('status').textContent='กรุณาเลือกจุดหมายก่อน';return}let u='https://www.google.com/maps/dir/?api=1&destination='+dest.lat+','+dest.lon+'&travelmode=driving';if(me)u+='&origin='+me.lat+','+me.lon;location.href=u}
$('route').onclick=()=>{if(!dest){$('status').textContent='กรุณาเลือกจุดหมายก่อน';return}if(!me){$('status').textContent='กดตำแหน่งฉันก่อน';return}google()};$('google').onclick=google;
</script></body></html>
